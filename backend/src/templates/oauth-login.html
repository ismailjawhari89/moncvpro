<!DOCTYPE html>
<html>

<head>
    <style>
        .container {
            font-family: 'Inter', sans-serif;
            max-width: 600px;
            margin: 0 auto;
            background: #0f172a;
            color: #f8fafc;
            padding: 40px;
            border-radius: 16px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .content {
            line-height: 1.6;
        }

        .provider-badge {
            background: #1e293b;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            color: #3b82f6;
            display: inline-block;
            text-transform: capitalize;
        }

        .footer {
            font-size: 12px;
            color: #64748b;
            text-align: center;
            margin-top: 40px;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <span class="logo">MonCVPro</span>
        </div>
        <div class="content">
            <h1>Login via {{provider}} ☁️</h1>
            <p>You have successfully logged into MonCVPro using your <span class="provider-badge">{{provider}}</span>
                account.</p>
            <p>If this was you, you're all set! If you didn't expect this, you can check your account activity in your
                settings.</p>
            <div style="text-align: center; margin-top: 30px;">
                <a href="{{settingsUrl}}"
                    style="background: #3b82f6; color: white; padding: 12px 24px; border-radius: 10px; text-decoration: none; font-weight: 600;">Manage
                    My Account</a>
            </div>
        </div>
        <div class="footer">
            © 2026 MonCVPro | The Future of Career Building
        </div>
    </div>
</body>

</html>
